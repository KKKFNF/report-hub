<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실적 vs 컨센서스</title>
<style>
:root{--bg:#0f1115;--card:#191c22;--card2:#1e222b;--bd:#2a2f3a;--tx:#e7eaee;--mut:#9aa2ad;--acc:#5db0ff;--up:#7ee7a1;--dn:#ff7b7b;--beat:#4a90e2;--miss:#e06666;--mid:#6b7380}
*{box-sizing:border-box}
body{font:15px/1.55 -apple-system,'Apple SD Gothic Neo',system-ui,Segoe UI,sans-serif;max-width:1320px;margin:0 auto;padding:20px 16px 60px;color:var(--tx);background:var(--bg)}
a{color:var(--acc)}
.head{background:linear-gradient(160deg,#1d2430,#191c22);border:1px solid var(--bd);border-radius:16px;padding:18px 22px;margin-bottom:12px}
.head h1{margin:0 0 4px;font-size:22px}
.head p{margin:0;color:var(--mut);font-size:13.5px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.nav a{background:var(--card2);color:#cdd3dc;padding:7px 13px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--bd)}
.sumwrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.scard h3{margin:0 0 2px;font-size:13.5px;color:#cdd3dc}
.scard .big{font-size:21px;font-weight:700}
.scard .sub{color:var(--mut);font-size:12.5px}
.sbar{display:flex;gap:2px;height:10px;margin:8px 0 6px}
.sbar i{display:block;border-radius:3px;min-width:2px}
.sleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.sleg b{color:var(--tx);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ctl{position:sticky;top:0;z-index:6;background:rgba(15,17,21,.95);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:12px;padding:9px 10px;margin:0 0 8px}
.ctl .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .row+.row{margin-top:7px}
.ctl label{font-size:12.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ctl input[type=text],.ctl input[type=number],.ctl select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:13px;font-family:inherit}
.ctl input[type=text]{width:150px}
.ctl input[type=number]{width:62px}
.ctl input[type=checkbox]{accent-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{background:var(--card2);color:#cdd3dc;border:0;border-right:1px solid var(--bd);padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#0f1115}
.btn{background:var(--card2);color:#cdd3dc;border:1px solid var(--bd);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.cnt{margin-left:auto;font-size:13px;color:var(--mut)}
.cnt b{color:var(--tx)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
thead th{background:var(--card2);color:#cdd3dc;font-size:12.5px;position:sticky;top:0;cursor:pointer;user-select:none}
thead tr.grp th{cursor:default;text-align:center;border-left:1px solid var(--bd)}
thead th.s::after{content:' ▾';color:var(--acc)}
thead th.s.asc::after{content:' ▴'}
td.nm,th.nm{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:190px}
thead th.nm{background:var(--card2);z-index:2}
td.nm b{font-weight:700}
td.nm small{display:block;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
td.gl,th.gl{border-left:1px solid var(--bd)}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:#20252e}
td.c{color:var(--mut)}
td.h{font-weight:700;min-width:64px}
.tag{display:inline-block;font-size:10.5px;color:var(--mut);border:1px solid var(--bd);border-radius:5px;padding:0 4px;margin-left:4px;font-weight:400;vertical-align:1px}
.g{font-size:10px;margin-right:2px}
.g.u{color:var(--up)}.g.d{color:var(--dn)}
tr.det td{background:#14171c;text-align:left;white-space:normal;padding:12px 14px}
.dwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.dwrap table{width:auto;font-size:12.5px;border:1px solid var(--bd);border-radius:8px}
.dwrap th{position:static;cursor:default}
.dwrap td,.dwrap th{padding:4px 8px}
.chart{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.chart h4{margin:0 0 4px;font-size:12.5px;color:#cdd3dc;font-weight:700}
.chart .lg{font-size:11.5px;color:var(--mut);display:flex;gap:12px;margin-top:2px}
.chart svg text{fill:var(--mut);font-size:10.5px}
.note{color:var(--mut);font-size:12.5px;margin-top:14px}
.note li{margin:2px 0}
details{margin-top:10px;color:var(--mut);font-size:12.5px}
details summary{cursor:pointer;color:#cdd3dc}
.empty{padding:28px;text-align:center;color:var(--mut)}
@media(max-width:760px){.sumwrap{grid-template-columns:1fr}.ctl{position:static}body{padding:14px 16px 50px}}
</style>
</head>

    cell:s => `<td class="${i === 0 ? 'gl' : ''}" title="${esc(tip(s, i, k))}">${won((val(s, i, k) || [])[0])}</td>`}));
  cols.push({id:'qoq', h:'전 분기 대비', gl:1, get:s => chgSort(chg(s, k, L, L - 1)), cell:s => `<td class="gl">${chgTxt(chg(s, k, L, L - 1))}</td>`});
  cols.push({id:'yoy', h:'전년 동기 대비', get:s => chgSort(chg(s, k, L, YA)), cell:s => `<td>${chgTxt(chg(s, k, L, YA))}</td>`});
  return cols;
}

// ── 필터 ──
function pass(s) {
  const k = st.acc, p = val(s, L, k);
  if (st.q && !(s.n.toLowerCase().includes(st.q) || s.c.includes(st.q))) return false;
  if (st.mkt && s.m !== st.mkt) return false;
  if (st.sec && s.s !== st.sec) return false;
  if (s.v < st.cap) return false;
  if (st.cons && !(p && p[0] != null && p[1] != null)) return false;
  if (st.cls.size && !st.cls.has(cls(p))) return false;
  if (st.rmin != null || st.rmax != null) {
    const r = rate(p);
    if (r == null || (st.rmin != null && r < st.rmin) || (st.rmax != null && r > st.rmax)) return false;
  }
  if (st.all3 && !K.every(a => cls(val(s, L, a)) === 'B')) return false;
  if (st.str && streak(s, k) < st.str) return false;
  if (st.yoy) { const o = chg(s, k, L, YA); if (!o || !(o.a > o.b)) return false; }
  return true;
}

// ── 그리기 ──
function drawSummary(rows) {
  $('sum').innerHTML = K.map(a => {
    const c = {B:0, I:0, M:0}; let n = 0;
    rows.forEach(s => { const x = cls(val(s, L, a)); if (x) { c[x]++; n++; } });
    const pc = x => n ? Math.round(c[x] / n * 100) : 0;
    const seg = (x, col, nm) => c[x] ? `<i style="flex:${c[x]};background:${col}" title="${nm} ${c[x]}종목 (${pc(x)}%)"></i>` : '';
    return `<div class="scard"><h3>${Q[L]} ${KN[a]}</h3><div><span class="big">${pc('B')}%</span> <span class="sub">상회 · 비교 가능 ${n}종목</span></div>
      <div class="sbar">${seg('B', 'var(--beat)', '상회')}${seg('I', 'var(--mid)', '부합')}${seg('M', 'var(--miss)', '하회')}</div>
      <div class="sleg"><span><i class="dot" style="background:var(--beat)"></i>상회 <b>${c.B}</b></span><span><i class="dot" style="background:var(--mid)"></i>부합 <b>${c.I}</b></span><span><i class="dot" style="background:var(--miss)"></i>하회 <b>${c.M}</b></span></div></div>`;
  }).join('');
}
function chart(s, k) {
  const W = 400, H = 150, pl = 6, pb = 18, pt = 8, n = Q.length;
  const vs = []; s.q.forEach(q => { if (q) q[k].forEach(v => { if (v != null) vs.push(v); }); });
  if (!vs.length) return '';
  const mx = Math.max(0, ...vs), mn = Math.min(0, ...vs), rg = (mx - mn) || 1;
  const y = v => pt + (mx - v) / rg * (H - pt - pb), bw = (W - pl * 2) / n, w = Math.min(30, bw * 0.56);
  let g = `<line x1="${pl}" x2="${W - pl}" y1="${y(0)}" y2="${y(0)}" stroke="#3a4150" stroke-width="1"/>`;
  s.q.forEach((q, i) => {
    const cx = pl + bw * (i + 0.5);
    g += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${Q[i]}</text>`;
    if (!q) return;
    const [a, c] = q[k];
    if (a != null) g += `<rect x="${cx - w / 2}" width="${w}" y="${Math.min(y(a), y(0))}" height="${Math.max(1, Math.abs(y(a) - y(0)))}" rx="3" fill="#5db0ff"><title>${esc(tip(s, i, k))}</title></rect>`;
    if (c != null) g += `<line x1="${cx - w / 2 - 5}" x2="${cx + w / 2 + 5}" y1="${y(c)}" y2="${y(c)}" stroke="#e7eaee" stroke-width="2" stroke-linecap="round"><title>${esc(tip(s, i, k))}</title></line>`;
  });
  return `<div class="chart"><h4>${KN[k]} · 분기별 실제와 컨센서스 (억원)</h4><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.n)} ${KN[k]} 분기별 실제와 컨센서스">${g}</svg>
    <div class="lg"><span><i class="dot" style="background:#5db0ff"></i>실제</span><span><i class="dot" style="background:#e7eaee;height:2px;width:14px;vertical-align:3px"></i>발표 직전 컨센서스</span></div></div>`;
}
function detail(s, ncol) {
  let rows = '';
  s.q.forEach((q, i) => {
    rows += `<tr><td class="nm" style="position:static">${Q[i]}</td>`;
    if (!q) { rows += `<td colspan="10" class="c" style="text-align:center">자료 없음</td></tr>`; return; }
    rows += `<td class="c">${q.d || '–'} <span class="tag">${q.b === 'P' ? '별도' : '연결'}</span><span class="tag">${esc(q.t || '')}</span></td>`;
    K.forEach(a => { rows += `<td class="gl">${won(q[a][0])}</td><td class="c">${won(q[a][1])}</td>` + rateCell(s, i, a); });
    rows += '</tr>';
  });
  return `<tr class="det"><td colspan="${ncol}"><div class="dwrap">
    <div><table><thead><tr class="grp"><th rowspan="2" style="text-align:left">분기</th><th rowspan="2">발표일·기준</th>${K.map(a => `<th colspan="3">${KN[a]}</th>`).join('')}</tr>
    <tr>${K.map(() => '<th class="gl">실제</th><th>컨센서스</th><th>달성률</th>').join('')}</tr></thead><tbody>${rows}</tbody></table>
    <div class="note" style="margin-top:6px">단위 억원 · 분기 3개월 · <a href="https://finance.naver.com/item/main.naver?code=${s.c}" target="_blank" rel="noopener">네이버 금융</a> · <a href="https://dart.fss.or.kr/dsab007/main.do?textCrpNm=${s.c}" target="_blank" rel="noopener">DART 공시</a></div></div>
    ${chart(s, st.acc)}</div></td></tr>`;
}
function draw() {
  const cols = columns();
  if (!cols.some(c => c.id === st.sort)) { st.sort = 'v'; st.dir = -1; }
  const sc = cols.find(c => c.id === st.sort);
  const rows = S.filter(pass);
  rows.sort((a, b) => {
    const x = sc.get(a), y = sc.get(b);
    if (x == null && y == null) return b.v - a.v;
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y) * st.dir || b.v - a.v;
  });
  // 머리글: 묶음 행 + 열 행
  let g = '', i = 0, hasGrp = cols.some(c => c.grp);
  if (hasGrp) {
    while (i < cols.length) {
      const c = cols[i];
      if (c.grp) { const sp = c.span || (st.view === 'sum' && c.id !== 'yoy' ? 3 : 2); g += `<th colspan="${sp}">${c.grp}</th>`; i += sp; }
      else { g += `<th${c.cl ? ' class="' + c.cl + '"' : ''} style="cursor:default"></th>`; i++; }
    }
  }
  $('tb').tHead.innerHTML = (hasGrp ? `<tr class="grp">${g}</tr>` : '') + '<tr>' + cols.map(c =>
    `<th data-id="${c.id}" class="${[c.cl || '', c.gl ? 'gl' : '', c.id === st.sort ? 's' + (st.dir > 0 ? ' asc' : '') : ''].join(' ').trim()}">${c.h}</th>`).join('') + '</tr>';
  $('tb').tBodies[0].innerHTML = rows.length ? rows.map(s =>
    `<tr class="r" data-c="${s.c}">${cols.map(c => c.cell(s)).join('')}</tr>` + (st.open.has(s.c) ? detail(s, cols.length) : '')).join('')
    : `<tr><td colspan="${cols.length}" class="empty">조건에 맞는 종목이 없습니다.</td></tr>`;
  $('cnt').innerHTML = `<b>${rows.length}</b> / ${S.length}종목`;
  drawSummary(rows);
  return rows;
}

// ── 이벤트 ──
function seg(id, key, multi) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (multi) { b.classList.toggle('on'); st[key].has(b.dataset.v) ? st[key].delete(b.dataset.v) : st[key].add(b.dataset.v); }
    else { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); st[key] = b.dataset.v; }
    draw();
  });
}
seg('f_acc', 'acc'); seg('f_view', 'view'); seg('f_cls', 'cls', true);
const numv = id => { const v = $(id).value.trim(); return v === '' || isNaN(+v) ? null : +v; };
[['f_q', () => st.q = $('f_q').value.trim().toLowerCase()], ['f_mkt', () => st.mkt = $('f_mkt').value], ['f_sec', () => st.sec = $('f_sec').value],
 ['f_cap', () => st.cap = +$('f_cap').value], ['f_rmin', () => st.rmin = numv('f_rmin')], ['f_rmax', () => st.rmax = numv('f_rmax')],
 ['f_tol', () => st.tol = Math.max(0, numv('f_tol') ?? 10)], ['f_cons', () => st.cons = $('f_cons').checked], ['f_all3', () => st.all3 = $('f_all3').checked],
 ['f_str', () => st.str = +$('f_str').value], ['f_yoy', () => st.yoy = $('f_yoy').checked]].forEach(([id, fn]) => $(id).addEventListener('input', () => { fn(); draw(); }));
$('tb').tHead.addEventListener('click', e => {
  const th = e.target.closest('th[data-id]'); if (!th) return;
  if (st.sort === th.dataset.id) st.dir = -st.dir; else { st.sort = th.dataset.id; st.dir = th.dataset.id === 'n' ? 1 : -1; }
  draw();
});
$('tb').tBodies[0].addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr.r'); if (!tr) return;
  st.open.has(tr.dataset.c) ? st.open.delete(tr.dataset.c) : st.open.add(tr.dataset.c);
  draw();
});
$('b_reset').addEventListener('click', () => {
  Object.assign(st, {q:'', mkt:'', sec:'', cap:0, cls:new Set(), rmin:null, rmax:null, tol:10, cons:true, all3:false, str:0, yoy:false});
  ['f_q', 'f_rmin', 'f_rmax'].forEach(i => $(i).value = ''); $('f_mkt').value = ''; $('f_sec').value = ''; $('f_cap').value = '0'; $('f_tol').value = 10; $('f_str').value = '0';
  $('f_cons').checked = true; $('f_all3').checked = false; $('f_yoy').checked = false; $('f_cls').querySelectorAll('button').forEach(b => b.classList.remove('on'));
  draw();
});
$('b_csv').addEventListener('click', () => {
  const rows = S.filter(pass), head = ['코드', '종목', '시장', '업종', '시가총액(억)'];
  Q.forEach(q => K.forEach(a => head.push(`${q} ${KN[a]} 실제`, `${q} ${KN[a]} 컨센서스`, `${q} ${KN[a]} 달성률(%)`)));
  const cell = v => v == null ? '' : typeof v === 'number' ? String(Math.round(v * 100) / 100) : '"' + String(v).replace(/"/g, '""') + '"';
  const out = [head.map(cell).join(',')].concat(rows.map(s => {
    const r = [s.c, s.n, s.m === 'KS' ? '코스피' : '코스닥', s.s, s.v];
    s.q.forEach(q => K.forEach(a => { const p = q ? q[a] : [null, null]; r.push(p[0], p[1], rate(p)); }));
    return r.map(cell).join(',');
  }));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = `실적_컨센서스_${Q[L]}.csv`; a.click(); URL.revokeObjectURL(a.href);
});

// ── 처음 ──
(function init() {
  document.title = `${Q[L]} 실적 vs 컨센서스`;
  $('ttl').textContent = `🎯 ${Q[L]} 실적 vs 컨센서스`;
  $('sub').innerHTML = `시가총액 ${cap(M.min_mcap)} 이상 보통주 ${M.n_univ}종목 중 ${Q[L]} 실적이 반영된 <b style="color:var(--tx)">${M.n}종목</b> · 컨센서스 있음 ${M.n_cons}종목 · 시가총액 ${M.px.slice(0, 10)} 종가 기준 · 갱신 ${M.built}`;
  const cnt = {}; S.forEach(s => { if (s.s) cnt[s.s] = (cnt[s.s] || 0) + 1; });
  $('f_sec').innerHTML += Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || a.localeCompare(b, 'ko')).map(k => `<option value="${esc(k)}">${esc(k)} (${cnt[k]})</option>`).join('');
  if (M.pending.length) $('pend').innerHTML = `<summary>아직 반영되지 않은 종목 ${M.pending.length}개 (분기보고서를 방금 냈거나 아직 내지 않아 재무 자료가 올라오지 않음)</summary><p>${M.pending.map(p => `${esc(p.n)}(${cap(p.v)})`).join(' · ')}</p>`;
  $('note').innerHTML = [
    '달성률 = 실제 ÷ 발표 직전 컨센서스. 실제나 컨센서스가 적자이면 달성률 대신 "적자·예상 흑자", "흑자·예상 적자", "적자 폭 작음/큼"(예상 대비)으로 표시합니다.',
    '판정은 컨센서스 대비 차이가 부합 범위(기본 ±10%)를 넘으면 상회(▲)·하회(▼), 안이면 부합입니다. 범위는 위에서 바꿀 수 있습니다.',
    '금액은 억원, 분기 3개월 기준입니다. 분기는 달력 분기(1Q = 1~3월)이며, 순이익은 연결이면 지배주주 순이익입니다.',
    `실적·컨센서스 출처는 FnGuide 어닝서프라이즈와 실적속보(2026-11-17 이후 발표분은 DART 잠정실적 공시)입니다(${M.n_fg}종목). FnGuide에 아직 없는 ${M.n_dart}종목의 ${Q[L]} 실제값은 DART 분기보고서, 컨센서스는 와이즈리포트의 발표직전 값(없으면 발표 전 3개월 안의 가장 가까운 값)입니다('보고서' 표시). 지난 분기에 FnGuide·잠정 공시 실적이 없는 칸도 DART 분기·반기·사업보고서 값으로 채웁니다(4분기는 연간에서 3분기 누적을 뺀 값, 컨센서스 없음). 외화로 보고하는 회사는 DART 값을 쓰지 않습니다.`,
    '컨센서스는 추정 기관이 1곳뿐인 종목도 포함합니다. 달성률이 극단적인 종목은 컨센서스 금액이 작은 경우가 많습니다.',
    '행을 누르면 분기별 상세와 그래프가 열립니다. 열 제목을 누르면 정렬됩니다.'].map(t => `<li>${t}</li>`).join('');
  st.sort = 'r_op';
  // 주소 뒤 #view=rate&acc=ni&open=005930 으로 처음 화면을 지정할 수 있다
  new URLSearchParams(location.hash.slice(1)).forEach((v, k) => {
    if (k === 'view' && ['sum', 'rate', 'act'].includes(v)) { st.view = v; $('f_view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); }
    if (k === 'acc' && K.includes(v)) { st.acc = v; $('f_acc').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); st.sort = 'r_' + v; }
    if (k === 'open') v.split(',').forEach(c => st.open.add(c));
    if (k === 'q') { st.q = v.toLowerCase(); $('f_q').value = v; }
  });
  draw();
})();
</script>
</body>
